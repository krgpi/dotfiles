model = "gpt-5.5"
model_reasoning_effort = "low"
approval_policy = "never"
approvals_reviewer = "auto_review"
default_permissions = "workspace-write-git"

[permissions.workspace-write-git]
extends = ":workspace"

[permissions.workspace-write-git.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"

[permissions.workspace-write-git.network]
enabled = true

[permissions.workspace-write-git.network.domains]
"*" = "allow"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]
