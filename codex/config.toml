model = "gpt-5.6-sol"
model_reasoning_effort = "low"
approval_policy = "never"
approvals_reviewer = "auto_review"
default_permissions = "workspace-write-git"

[permissions.workspace-write-git]
extends = ":workspace"

[permissions.workspace-write-git.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"

[permissions.workspace-write-git.network]
enabled = true

[permissions.workspace-write-git.network.domains]
"*" = "allow"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch"]

[tui.model_availability_nux]
gpt-6-astra = 1

[mcp_servers.aws-mcp]
command = "uvx"
args = ["mcp-proxy-for-aws@latest", "https://aws-mcp.us-east-1.api.aws/mcp", "--metadata", "INSTALL_SOURCE=aws-cli"]

[notice.model_migrations]
"gpt-5.5" = "gpt-5.6-sol"
