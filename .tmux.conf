# キーバインドvim風に
setw -g mode-keys vi

# 'v' で選択を始める(コピーモードの時)
# 'V'で行選択は効くが、なぜか'v'で選択が効かなかったため
bind -T copy-mode-vi v send -X begin-selection

# 'y' でヤンク（コピー）してコピーモードを終了
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# マウススクロール
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-down
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-up

# クリップボードにコピー
# マウススクロールをオンにすると、マウス選択コピーがクリップボードにコピーされなくなるため
set -s copy-command 'pbcopy' 

# ペイン操作
# "|" でペインを縦分割する
bind | split-window -h -c "#{pane_current_path}"
# "-" でペインを縦分割する
bind - split-window -v -c "#{pane_current_path}"

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1

bind n new-window

# サイドバー: セッション/ウィンドウ一覧を常時表示するペインを自動生成
# 新しいセッション・ウィンドウ作成時に左端にサイドバーペインを追加
set-hook -g after-new-session "split-window -hb -l 10 '~/Developer/dotfiles/tmux-session-sidebar.sh'; select-pane -t :.+"
set-hook -g after-new-window "split-window -hb -l 10 '~/Developer/dotfiles/tmux-session-sidebar.sh'; select-pane -t :.+"

# prefix + T でサイドバー再表示（閉じた場合に）
bind T split-window -hb -l 10 "~/Developer/dotfiles/tmux-session-sidebar.sh" \; select-pane -t :.+

# サイドバー更新シグナル（イベント発生時にSIGUSR1で即座に再描画）
# [t] のブラケットトリックで pkill が自分自身にマッチするのを防ぐ
set-hook -g client-session-changed "run-shell -b 'pkill -USR1 -f \"[t]mux-session-sidebar\" 2>/dev/null || true'"
set-hook -g after-select-window "run-shell -b 'pkill -USR1 -f \"[t]mux-session-sidebar\" 2>/dev/null || true'"
set-hook -g after-select-pane "run-shell -b 'pkill -USR1 -f \"[t]mux-session-sidebar\" 2>/dev/null || true'"
# pane_title が "sidebar" のペイン（サイドバー自身）の変更では発火しない
set-hook -g pane-title-changed "if -F '#{!=:#{pane_title},sidebar}' \"run-shell -b 'pkill -USR1 -f \\\"[t]mux-session-sidebar\\\" 2>/dev/null || true'\""
set-hook -g window-linked "run-shell -b 'pkill -USR1 -f \"[t]mux-session-sidebar\" 2>/dev/null || true'"
set-hook -g window-unlinked "run-shell -b 'pkill -USR1 -f \"[t]mux-session-sidebar\" 2>/dev/null || true'"

# ペインボーダー
# 太線で描画してアクティブペインを目立たせる
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=colour238"

# ステータスバー
set -g status-interval 5
set -g status-style "bg=default"
set -g status-left-length 60
set -g status-left "#[fg=cyan,bold][#S]#[default] "
set -g window-status-format "#[fg=white,dim] #I:#W "
set -g window-status-current-format "#[fg=cyan,bold] #I:#W #[default]"
set -g status-right "#[fg=white]%Y-%m-%d %H:%M"

