# キーバインドvim風に
setw -g mode-keys vi

# 'v' で選択を始める(コピーモードの時)
# 'V'で行選択は効くが、なぜか'v'で選択が効かなかったため
bind -T copy-mode-vi v send -X begin-selection

# 'y' でヤンク（コピー）してコピーモードを終了
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# マウススクロール
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-down
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-up

# クリップボードにコピー
# マウススクロールをオンにすると、マウス選択コピーがクリップボードにコピーされなくなるため
if-shell 'uname -s | grep -q Darwin' \
    "set -s copy-command 'pbcopy'" \
    "set -s copy-command 'xclip -selection clipboard'"

# ペイン操作
# "|" でペインを縦分割する
bind | split-window -h -c "#{pane_current_path}"
# "-" でペインを縦分割する
bind - split-window -v -c "#{pane_current_path}"

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1

bind n new-window

# prefix + Tab で次のペインへ（狭いときはズーム維持で巡回）
bind Tab run-shell "~/Developer/dotfiles/tmux-cycle-pane.sh"

# prefix + 数字キーでセッション切り替え（ステータスバーの表示順）
bind 1 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 1"
bind 2 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 2"
bind 3 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 3"
bind 4 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 4"
bind 5 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 5"
bind 6 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 6"
bind 7 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 7"
bind 8 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 8"
bind 9 run-shell "~/Developer/dotfiles/tmux-switch-session.sh 9"

# ステータスバーのクリックで切り替え（行番号で振り分け: 1行目=セッション, 2行目=ペイン）
bind -n MouseDown1StatusLeft    run-shell "~/Developer/dotfiles/tmux-status-click.sh #{mouse_status_line} #{mouse_x}"
bind -n MouseDown1Status        run-shell "~/Developer/dotfiles/tmux-status-click.sh #{mouse_status_line} #{mouse_x}"
bind -n MouseDown1StatusDefault run-shell "~/Developer/dotfiles/tmux-status-click.sh #{mouse_status_line} #{mouse_x}"

# セッション切り替え時のClaude既読処理（フラグ削除 + 既読ロック作成）
# ※ 全ペインに発火するが、既読ロックはUserPromptSubmit(reset-lock)でクリアされる
set-hook -g after-select-pane "run-shell -b '~/Developer/dotfiles/tmux-mark-read.sh #{pane_id}'"

# ペインボーダー
# 太線で描画してアクティブペインを目立たせる
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=colour238"

# ステータスバー（上部にセッション一覧を横並び表示）
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235"
set -g status-left-length 200
set -g status-right-length 200
# セッション一覧（常時表示）、prefix押下時はチートシートをstatus-rightに表示
set -g status-left "#(~/Developer/dotfiles/tmux-session-bar.sh)"
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right "#{?client_prefix,#[fg=cyan bold] | #[fg=white]split #[fg=colour245]- │  n #[fg=white]window  z #[fg=white]zoom  d #[fg=white]detach  [ #[fg=white]copy  s #[fg=white]sessions,#[fg=white]%H:%M}"

# ── レスポンシブレイアウト（狭い端末では1ペイン表示＋ペイン切り替えバー）──
# 端末幅が狭いときはレイアウトを解消して1ペインだけズーム表示し、
# ステータス2行目にペイン切り替えバーを出す（広いときは自動で元に戻る）
set-hook -g client-resized "run-shell -b '~/Developer/dotfiles/tmux-responsive-layout.sh'"
set-hook -g client-attached "run-shell -b '~/Developer/dotfiles/tmux-responsive-layout.sh'"

# ステータス2行目: ペイン切り替えバー（status 2 のとき＝狭いときだけ表示される）
set -g status-format[1] "#[align=left bg=colour235]#(~/Developer/dotfiles/tmux-pane-bar.sh)"

