# キーバインドvim風に
setw -g mode-keys vi

# 'v' で選択を始める(コピーモードの時)
# 'V'で行選択は効くが、なぜか'v'で選択が効かなかったため
bind -T copy-mode-vi v send -X begin-selection

# 'y' でヤンク（コピー）してコピーモードを終了
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# マウススクロール
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-down
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-up

# クリップボードにコピー
# マウススクロールをオンにすると、マウス選択コピーがクリップボードにコピーされなくなるため
if-shell 'uname -s | grep -q Darwin' \
    "set -s copy-command 'pbcopy'" \
    "set -s copy-command 'xclip -selection clipboard'"

# ペイン操作
# "|" でペインを縦分割する
bind | split-window -h -c "#{pane_current_path}"
# "-" でペインを縦分割する
bind - split-window -v -c "#{pane_current_path}"

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1

# ── dev レイアウト ────────────────────────────────────────────
# 全ウィンドウ（claude1, claude2, lg, nv, sh1 ...）は1つの tmux セッションに入る。
# 「フォルダ」は tmux 上の実体ではなく、各ウィンドウのアクティブペインが今いる
# パスでサイドバーがその場でグルーピングして見せているだけ（cd すれば移る）。
# 各ウィンドウの左端には常駐サイドバーが入り、そのツリーを表示する

# ウィンドウの追加（現在のウィンドウと同じパスに作る）
bind c run-shell "~/Developer/dotfiles/tmux-dev.sh new claude"
bind t run-shell "~/Developer/dotfiles/tmux-dev.sh new term"
bind g run-shell "~/Developer/dotfiles/tmux-dev.sh new lg"
bind e run-shell "~/Developer/dotfiles/tmux-dev.sh new nv"
bind n run-shell "~/Developer/dotfiles/tmux-dev.sh new term"

# 閉じる（x = このウィンドウ、X = 同じパスのウィンドウをまとめて、C-x = ペインだけ）
bind x confirm-before -p "このウィンドウを閉じますか? (y/n)" "run-shell '~/Developer/dotfiles/tmux-dev.sh close-window'"
bind X confirm-before -p "同じパスのウィンドウをまとめて閉じますか? (y/n)" "run-shell '~/Developer/dotfiles/tmux-dev.sh close-folder'"
bind C-x kill-pane

# サイドバーの表示切替
bind b run-shell "~/Developer/dotfiles/tmux-dev.sh toggle-sidebar"

# prefix + 数字でフォルダ（パスのグループ）を切り替える（サイドバーの表示順）
# 切り替えたあとは dev-jump テーブルに入るので、続けて数字を押すとその中のウィンドウへ飛べる
bind 1 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 1"
bind 2 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 2"
bind 3 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 3"
bind 4 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 4"
bind 5 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 5"
bind 6 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 6"
bind 7 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 7"
bind 8 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 8"
bind 9 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-folder 9"

# dev-jump テーブル: フォルダ切り替え直後の1キーでセッションを選ぶ
bind -T dev-jump 1 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 1"
bind -T dev-jump 2 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 2"
bind -T dev-jump 3 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 3"
bind -T dev-jump 4 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 4"
bind -T dev-jump 5 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 5"
bind -T dev-jump 6 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 6"
bind -T dev-jump 7 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 7"
bind -T dev-jump 8 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 8"
bind -T dev-jump 9 run-shell "~/Developer/dotfiles/tmux-dev.sh jump-window 9"
bind -T dev-jump Escape switch-client -T root

# ウィンドウ/フォルダの巡回（-r で prefix なしの連打が効く）
# h/l は同じパス内のウィンドウ、H/L はパス（フォルダ）を切り替える
bind -r h run-shell "~/Developer/dotfiles/tmux-dev.sh cycle-window prev"
bind -r l run-shell "~/Developer/dotfiles/tmux-dev.sh cycle-window next"
bind -r H run-shell "~/Developer/dotfiles/tmux-dev.sh cycle-folder prev"
bind -r L run-shell "~/Developer/dotfiles/tmux-dev.sh cycle-folder next"

# prefix + Tab で次のペインへ（狭いときはズーム維持で巡回。サイドバーは飛ばす）
bind Tab run-shell "~/Developer/dotfiles/tmux-cycle-pane.sh"

# サイドバーのクリックでフォルダ/セッションを切り替える
# サイドバー以外のペインは tmux の既定動作（ペイン選択 + マウスイベント転送）に流す
bind -n MouseDown1Pane {
    if -F "#{==:#{mouse_pane},#{@sidebar_pane}}" {
        run-shell "~/Developer/dotfiles/tmux-dev.sh sidebar-click #{mouse_y}"
    } {
        select-pane -t =
        send-keys -M
    }
}

# ステータスバー2行目（狭いとき）のクリックでペインを切り替える
bind -n MouseDown1Status        run-shell "~/Developer/dotfiles/tmux-click-pane.sh #{mouse_x}"
bind -n MouseDown1StatusDefault run-shell "~/Developer/dotfiles/tmux-click-pane.sh #{mouse_x}"

# ペイン選択時: サイドバーにフォーカスが来たら隣へ逃がす（tmux だけで完結させる）
# それ以外のペインは Claude の既読処理に回す
set-hook -g after-select-pane "if -F '#{@sidebar}' { select-pane -t :.+ } { run-shell -b '~/Developer/dotfiles/tmux-dev.sh on-select-pane #{pane_id}' }"

# ペイン分割やリサイズで崩れたサイドバーの幅を戻す
set-hook -g window-layout-changed "run-shell -b '~/Developer/dotfiles/tmux-dev.sh fix-width #{window_id}'"

# セッション（ウィンドウ）を開いたとき: 中の Claude を既読にしてサイドバーを描き直す
set-hook -g after-select-window "run-shell -b '~/Developer/dotfiles/tmux-dev.sh on-select-window'"
set-hook -g client-session-changed "run-shell -b '~/Developer/dotfiles/tmux-dev.sh on-select-window'"

# ペインボーダー
# 太線で描画してアクティブペインを目立たせる
set -g pane-border-lines heavy
set -g pane-active-border-style "fg=cyan"
set -g pane-border-style "fg=colour238"

# ステータスバー（フォルダ一覧はサイドバーが担当するので上部は現在地とヒントだけ）
# 現在地はウィンドウ名ではなく、今いるパスの basename（＝サイドバーのグループ名と一致する）
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour235"
set -g status-left-length 100
set -g status-right-length 200
set -g status-left "#[fg=cyan,bold] #{b:pane_current_path} #[fg=colour245]#W "
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-right "#{?#{==:#{client_key_table},dev-jump},#[fg=yellow bold]press 1-9 for window,#{?client_prefix,#[fg=cyan bold]c#[fg=white] claude #[fg=cyan bold]t#[fg=white] term #[fg=cyan bold]g#[fg=white] lg #[fg=cyan bold]e#[fg=white] editor #[fg=cyan bold]| -#[fg=white] split #[fg=cyan bold]b#[fg=white] sidebar #[fg=cyan bold]x#[fg=white] close,#[fg=colour245]#{host_short} #[fg=white]%H:%M}}"

# ── レスポンシブレイアウト（狭い端末では1ペイン表示＋ペイン切り替えバー）──
# 端末幅が狭いときはサイドバーごとズームで隠して1ペインだけ表示し、
# ステータス2行目にペイン切り替えバーを出す（広いときは自動で元に戻る）
set-hook -g client-resized "run-shell -b '~/Developer/dotfiles/tmux-responsive-layout.sh'"
set-hook -g client-attached "run-shell -b '~/Developer/dotfiles/tmux-responsive-layout.sh'"

# ステータス2行目: ペイン切り替えバー（status 2 のとき＝狭いときだけ表示される）
set -g status-format[1] "#[align=left bg=colour235]#(~/Developer/dotfiles/tmux-pane-bar.sh #{window_id})"
