# キーバインドvim風に
setw -g mode-keys vi

# 'v' で選択を始める(コピーモードの時)
# 'V'で行選択は効くが、なぜか'v'で選択が効かなかったため
bind -T copy-mode-vi v send -X begin-selection

# マウススクロール
set -g mouse on
bind-key -T edit-mode-vi WheelUpPane send-keys -X scroll-down
bind-key -T edit-mode-vi WheelDownPane send-keys -X scroll-up


# クリップボードにコピー
# マウススクロールをオンにすると、マウス選択コピーがクリップボードにコピーされなくなるため
set -s copy-command 'pbcopy' 

# 設定ファイル再読み込み r
# bind r source-file ~/.tmux.conf \; display "Reloaded"

# ペイン操作
# "|" でペインを縦分割する
bind | split-window -h
# "-" でペインを縦分割する
bind - split-window -v
# vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインの開始番号を 0 から 1 に変更する
set-option -g base-index 1

bind n new-window

# ホストネーム表示とハッシュベースの色設定
# ホストネームのハッシュ値に基づいてステータスバーの色を変更
# colour0-colour255 の範囲でランダムに色を割り当て
set -g status-left-length 40
set -g status-left "#[fg=white,bg=colour#{e|%:#{h:host},256}] #h #[default] "

# ステータスバー全体の背景色をホストネームのハッシュ値で変更
set -g status-style "bg=colour#{e|%:#{h:host},256},fg=white"

# 右側はデフォルト表示
set -g status-right "%Y-%m-%d %H:%M"

